name: Android Mobile CI

on:
  push:
    branches:
      - feature/android-mobile-foundation
  pull_request:
    branches:
      - main
      - feature/android-mobile-foundation
    paths:
      - "mobile/**"
      - ".github/workflows/android-mobile.yml"
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Собрать APK (по умолчанию выключено)"
        required: false
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy SDK package 'tools' was removed; install only platform-tools.
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          # The preview SDK is published as android-37.0, while AGP resolves compileSdk 37 as android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Run domain tests
        run: |
          gradle :core:model:test
          gradle :core:geometry:test

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSignalStudio-Mobile-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
