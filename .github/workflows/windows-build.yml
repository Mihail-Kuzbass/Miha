name: TrafficSignalStudio Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main, feature/sumo-integration]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "TrafficSignalStudio_GitHub_Import.zip" -DestinationPath "." -Force

      - name: Apply SUMO-first application sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "TrafficSignalStudio/app/integrations" | Out-Null
          Copy-Item "main_window.py" "TrafficSignalStudio/app/ui/main_window.py" -Force
          Copy-Item "sumo_engine.py" "TrafficSignalStudio/app/integrations/sumo_engine.py" -Force
          Copy-Item "test_sumo_engine.py" "TrafficSignalStudio/tests/test_sumo_engine.py" -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r TrafficSignalStudio/requirements.txt
          python -m pip install pytest

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "TrafficSignalStudio"
          python -m compileall -q TrafficSignalStudio/app TrafficSignalStudio/tests
          python -m pytest -q TrafficSignalStudio/tests

      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name TrafficSignalStudio
          --paths TrafficSignalStudio
          TrafficSignalStudio/app/main.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSignalStudio-Windows
          path: dist/TrafficSignalStudio/
