
name: TrafficSignalStudio Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "TrafficSignalStudio_GitHub_Import.zip" -DestinationPath "." -Force
          # Apply the maintained original-project UI source after extraction; no SUMO code is used.
          Copy-Item -LiteralPath "main_window.py" -Destination "TrafficSignalStudio/app/ui/main_window.py" -Force
          Copy-Item -LiteralPath "microsim.py" -Destination "TrafficSignalStudio/app/simulation/microsim.py" -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r TrafficSignalStudio/requirements.txt
          
      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "TrafficSignalStudio"
          Copy-Item -LiteralPath "test_microsim.py" -Destination "TrafficSignalStudio/tests/test_microsim.py" -Force
          python -m pytest -q TrafficSignalStudio/tests


      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name TrafficSignalStudio
          --paths TrafficSignalStudio
          TrafficSignalStudio/app/main.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSignalStudio-Windows
          path: dist/TrafficSignalStudio/
